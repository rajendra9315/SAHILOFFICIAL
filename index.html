<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOIN NOW FOR LATEST UPDATES </title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1a2b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.container {
    background: #0f2235;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    width: 320px;
    color: white;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

/* 🔥 Marquee inside box */
.marquee {
    background: black;
    color: #00ff88;
    padding: 8px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 15px;
}

.profile {
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #00ff88;
}

.profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Title */
h1 {
    margin: 10px 0;
}

/* Subtitle */
.sub {
    color: #ccc;
    font-size: 14px;
}

/* Active members */
.active {
    color: #00ff88;
    margin: 15px 0;
    font-weight: bold;
}

/* Button */
.btn {
    display: block;
    background: #28c76f;
    color: white;
    padding: 15px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 18px;
    margin-top: 20px;
}

/* Bottom text */
.bottom {
    margin-top: 15px;
    font-size: 12px;
    color: #ff4d4d;
}

.count {
    color: gold;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <!-- 🔥 Marquee INSIDE BOX -->
    <div class="marquee">
        <marquee>🔥 LIMITED OFFER - JOIN NOW 🚀 | 30,000+ USERS EARNING 💰  </marquee>
    </div>

    <div class="profile">
    <img src="sahil.jpg" alt="profile">
</div>

    <h1> 𝟗𝐗 𝐆𝐔𝐑𝐔 𝐒𝐀𝐇𝐈𝐋 🀄️</h1>

    <p class="sub">
        Join India's fastest growing Telegram color prediction channel 💸
    </p>

    <p class="active">🔥 30,000+ Active Members</p>

    <a href="https://t.me/+fgxfOM1ua2QzYTc1" class="btn">
        Join Telegram Now 🚀
    </a>

    <p class="bottom">
        ⚡ Limited seats. Join before it closes!
    </p>

    <p class="count">
        30003 people already joined today
    </p>

</div>

</body>
</html>
